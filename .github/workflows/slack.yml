name: Notify Slack

on:
  pull_request:
    branches:
      - release/development
    types: [opened, reopened, synchronize, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        env:
          # Set in GitHub: Settings > Secrets and variables > Actions > SLACK_WEBHOOK_URL
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BRANCH: ${{ github.head_ref }}
          MERGED: ${{ github.event.pull_request.merged }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "SLACK_WEBHOOK_URL not set; skipping"; exit 0; fi
          if [ "$MERGED" = "true" ]; then HEAD="*PR Merged into development*"; else HEAD="*New Pull Request Activity*"; fi
          TEXT="$HEAD\n• *Title:* ${PR_TITLE}\n• *PR #:* ${PR_NUMBER}\n• *Author:* ${PR_AUTHOR}\n• *Commit:* ${COMMIT_SHA}\n• *Branch:* ${BRANCH}\n• *URL:* ${PR_URL}"
          jq -n --arg text "$(printf "$TEXT")" '{text: $text}' | curl -sS -X POST -H 'Content-type: application/json' --data @- "$WEBHOOK"
